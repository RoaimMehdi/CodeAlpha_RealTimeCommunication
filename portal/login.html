<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CamKnock Staff &amp; Support Portal • Login</title>
  <link rel="icon" href="/assets/camknock-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 20%, #0E2919 0%, #06140D 100%);
      color: #E2ECE6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-box {
      background: #0A1E14;
      border: 1px solid rgba(74, 222, 128, 0.25);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 40px rgba(14,122,75,0.15);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }
    .field {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      background: #06170E;
      border: 1px solid rgba(74, 222, 128, 0.25);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field:focus { border-color: #4ADE80; box-shadow: 0 0 10px rgba(74,222,128,0.2); }
    .btn-login {
      height: 48px;
      background: #0E7A4B;
      color: #fff;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-login:hover { background: #12945B; transform: translateY(-1px); }
    .err-msg { color: #FCA5A5; font-size: 13px; font-weight: 600; text-align: center; min-height: 18px; }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="brand-header">
      <img src="/assets/camknock-icon.png" width="48" height="48" alt="CamKnock" style="border-radius:12px;box-shadow:0 6px 18px rgba(14,122,75,0.4)">
      <div>
        <h1 style="font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.02em">Cam<span style="color:#4ADE80">Knock</span></h1>
        <p style="font-size:12px;font-weight:700;color:#8CA395;letter-spacing:0.06em;text-transform:uppercase;margin-top:2px">Operations &amp; Support Portal</p>
      </div>
    </div>

    <form id="portalLoginForm" style="display:flex;flex-direction:column;gap:16px">
      <div>
        <label style="font-size:12px;font-weight:700;color:#A7BDB1;display:block;margin-bottom:6px">Staff Email</label>
        <input type="email" id="email" required placeholder="support@camknock.app" class="field">
      </div>
      <div>
        <label style="font-size:12px;font-weight:700;color:#A7BDB1;display:block;margin-bottom:6px">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="field">
      </div>

      <div class="err-msg" id="loginErr"></div>

      <button type="submit" id="loginBtn" class="btn-login">
        Sign in to Portal &rarr;
      </button>

      <div style="display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);font-size:12px;color:#8CA395">
        <a href="/" style="color:#4ADE80;text-decoration:none;font-weight:600">&larr; Back to CamKnock</a>
        <span>Helpline: +1 201-685-2107</span>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('portalLoginForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('loginErr');
      const btn = document.getElementById('loginBtn');
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Verifying access…';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('token', data.token);
          sessionStorage.setItem('token', data.token);
          window.location.href = '/portal';
        } else {
          errEl.textContent = data.error || 'Invalid staff credentials';
          btn.disabled = false;
          btn.textContent = 'Sign in to Portal →';
        }
      } catch (err) {
        errEl.textContent = 'Connection error';
        btn.disabled = false;
        btn.textContent = 'Sign in to Portal →';
      }
    };
  </script>
</body>
</html>
